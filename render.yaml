databases:
  - name: learning-db
    plan: free
    databaseName: learning
    user: learning

services:
  - type: web
    name: learning-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: learning-db
          property: connectionString
