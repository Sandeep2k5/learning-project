<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Learning Project</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 60px auto; }
  input, button { padding: 8px; font-size: 14px; }
  #notes { margin-top: 20px; }
  .note { padding: 6px 0; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
  <h2>My Learning Project</h2>
  <p id="status">Checking backend...</p>
  <input id="text" placeholder="Type a note" />
  <button onclick="addNote()">Add</button>
  <div id="notes"></div>

<script>
  // Default backend. Override without editing this file by adding
  // ?api=https://your-service.onrender.com to the page URL.
  const DEFAULT_API = "https://learning-api.onrender.com";
  const API_URL =
    new URLSearchParams(location.search).get("api") || DEFAULT_API;

  async function checkHealth() {
    try {
      const res = await fetch(API_URL + "/api/health");
      const data = await res.json();
      document.getElementById("status").innerText = "Backend OK: " + data.time;
    } catch (e) {
      document.getElementById("status").innerText = "Backend not reachable yet.";
    }
  }

  async function loadNotes() {
    try {
      const res = await fetch(API_URL + "/api/notes");
      const notes = await res.json();
      document.getElementById("notes").innerHTML = notes
        .map(n => `<div class="note">${n.text}</div>`)
        .join("");
    } catch (e) {
      // Backend asleep or unreachable; checkHealth() already reports it.
    }
  }

  async function addNote() {
    const text = document.getElementById("text").value;
    if (!text) return;
    await fetch(API_URL + "/api/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    document.getElementById("text").value = "";
    loadNotes();
  }

  checkHealth();
  loadNotes();
</script>
</body>
</html>
